{{define "body"}}
<div class="mb-4">
  <a class="text-xs text-ink-soft hover:text-ink inline-flex items-center gap-1" href="/projects/{{.Project.Slug}}?env={{.Env.Slug}}">
    <i class="ti ti-arrow-left"></i><span>{{.Project.Name}} / {{.Env.Name}}</span>
  </a>
</div>
<h1 class="text-base font-medium mb-4 flex items-center gap-2">
  <i class="ti ti-history"></i>History for <span class="keep-input-mono">{{.Key}}</span>
</h1>

<table class="keep-table">
  <thead>
    <tr><th class="w-16">Ver</th><th>When</th><th>Value</th><th class="w-px"></th></tr>
  </thead>
  <tbody>
    {{range .Versions}}
    <tr>
      <td class="text-ink-soft text-sm">v{{.Version}}</td>
      <td class="text-ink-soft text-sm">{{.WhenRel}}</td>
      <td><code class="keep-input-mono text-sm break-all">{{.Plain}}</code></td>
      <td class="whitespace-nowrap">
        <form method="post" action="/projects/{{$.Project.Slug}}/envs/{{$.Env.Slug}}/secrets/{{$.Key}}/versions/{{.Version}}/restore" class="inline">
          <button type="submit" class="icon-btn" aria-label="Restore" title="Restore this version"><i class="ti ti-arrow-back-up"></i></button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
{{end}}
