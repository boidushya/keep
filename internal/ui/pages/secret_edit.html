{{define "body"}}
<div class="mb-4">
  <a class="text-xs text-ink-soft hover:text-ink inline-flex items-center gap-1" href="/projects/{{.Project.Slug}}?env={{.Env.Slug}}">
    <i class="ti ti-arrow-left"></i><span>{{.Project.Name}} / {{.Env.Name}}</span>
  </a>
</div>
<h1 class="text-base font-medium mb-4">Edit <span class="keep-input-mono">{{.Key}}</span></h1>

<form method="post" action="/projects/{{.Project.Slug}}/envs/{{.Env.Slug}}/secrets/{{.Key}}" class="max-w-[640px] space-y-3">
  <input type="hidden" name="op" value="update">
  <label class="block">
    <span class="block text-xs text-ink-soft mb-1">Value (current: v{{.CurrentVersion}})</span>
    <textarea class="keep-input keep-input-mono" name="value" rows="6" required>{{.PlainValue}}</textarea>
  </label>
  <div class="flex gap-2">
    <button type="submit" class="keep-btn keep-btn-primary"><i class="ti ti-check"></i><span>Save new version</span></button>
    <a class="keep-btn keep-btn-ghost" href="/projects/{{.Project.Slug}}?env={{.Env.Slug}}"><i class="ti ti-x"></i><span>Cancel</span></a>
  </div>
</form>
{{end}}
